<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="description" content="Authorized TCP port availability checker"><title>Authorized Port Check</title><style>
:root{--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#64748b;--line:#dce3ec;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--amber:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{width:min(100% - 20px,760px);margin:auto;padding:20px 0 45px}header{text-align:center;margin-bottom:17px}.logo{width:54px;height:54px;margin:auto;display:grid;place-items:center;border-radius:15px;background:#eaf1ff;font-size:27px}h1{font-size:26px;margin:10px 0 5px}header p{margin:0;color:var(--muted);font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 5px 18px #0f172a0a}h2{font-size:17px;margin:0 0 12px}.field{margin-bottom:13px}label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}input[type=text],select{width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font-size:16px}input:focus,select:focus{outline:3px solid #bfdbfe;border-color:var(--blue)}.presets,.ports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.preset,.port{position:relative}.preset input,.port input{position:absolute;opacity:0}.preset label,.port label{display:flex;align-items:center;justify-content:center;min-height:45px;margin:0;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center;cursor:pointer;font-size:13px}.preset input:checked+label,.port input:checked+label{background:#eff6ff;color:#1d4ed8;border:2px solid var(--blue)}.port label{justify-content:flex-start}.port strong{margin-right:5px}.actions{display:flex;gap:8px;margin:11px 0}.small{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-weight:bold;color:#334155}.consent{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;font-size:13px;line-height:1.45}.consent input{width:20px;height:20px;flex:none}.consent label{margin:0}.scan{width:100%;min-height:54px;margin-top:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:18px;font-weight:bold}.scan:disabled{opacity:.55}.notice{padding:11px;border-radius:10px;font-size:14px;line-height:1.45}.notice.info{background:#eff6ff;color:#1e40af}.notice.error{background:#fff1f2;color:#be123c}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.stat{text-align:center;padding:11px 5px;border:1px solid var(--line);border-radius:11px}.stat strong{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.result-list{display:grid;gap:8px}.result{display:grid;grid-template-columns:64px 1fr auto;gap:9px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px}.badge{padding:6px;border-radius:8px;text-align:center;font-weight:bold}.open .badge{background:#dcfce7;color:var(--green)}.unreachable .badge{background:#fee2e2;color:var(--red)}.service strong{display:block}.service span,.meta{color:var(--muted);font-size:12px}.latency{font-size:12px;font-weight:bold}.copy{width:100%;min-height:45px;margin-top:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:bold}.footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.5}@media(min-width:600px){.presets{grid-template-columns:repeat(3,1fr)}.ports{grid-template-columns:repeat(3,1fr)}.card{padding:20px}}@media(max-width:390px){.app{width:min(100% - 14px,760px)}.result{grid-template-columns:58px 1fr}.latency{grid-column:2}.summary{gap:5px}}
</style></head><body><main class="app"><header><div class="logo">🔐</div><h1 id="appName">Authorized Port Check</h1><p>Check approved TCP services from this server.</p></header>
<section class="card"><h2>1. Authorized target</h2><div id="setupNotice" class="notice info hidden"></div><div class="field"><label for="target">Approved IP address</label><select id="target"><option value="">Loading policy...</option></select></div></section>
<section class="card"><h2>2. Services</h2><div class="presets" id="presets"></div><div class="actions"><button class="small" id="clear" type="button">Clear</button><button class="small" id="common" type="button">Common ports</button></div><div class="ports" id="ports"></div></section>
<section class="card"><h2>3. Authorization</h2><div class="consent"><input id="consent" type="checkbox"><label for="consent">I confirm that I own this target or have explicit permission to test it. I understand that all requests are restricted by the server allowlist.</label></div><button class="scan" id="scan" type="button">Check selected ports</button><div id="message" class="notice error hidden" style="margin-top:11px"></div></section>
<section class="card hidden" id="resultsCard"><h2>Result</h2><div class="summary"><div class="stat"><strong id="tested">0</strong><span>TESTED</span></div><div class="stat"><strong id="open">0</strong><span>OPEN</span></div><div class="stat"><strong id="noConnection">0</strong><span>NO CONNECTION</span></div></div><div id="resultList" class="result-list"></div><p id="resultMeta" class="meta"></p><button type="button" class="copy" id="copy">Copy result</button></section>
<p class="footer">TCP only. “No connection” can mean closed, filtered, or timed out.<br>The test originates from the PHP server, not from your browser.</p></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let policy=null,lastResult=null;function message(text=''){let e=$('#message');e.textContent=text;e.classList.toggle('hidden',!text)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function selected(){return $$('input[name=port]:checked').map(x=>Number(x.value))}function setPorts(values){let s=new Set(values.map(Number));$$('input[name=port]').forEach(x=>x.checked=s.has(Number(x.value)))}function renderPolicy(){
 $('#appName').textContent=policy.appName;let t=$('#target');t.innerHTML='<option value="">Select an approved target</option>';policy.targets.forEach(x=>{let o=document.createElement('option');o.value=x.cidr.includes('/32')?x.cidr.replace('/32',''):'';o.textContent=`${x.label} — ${x.cidr}`;o.disabled=!o.value;t.append(o)});if(!policy.targets.length){$('#setupNotice').textContent='No targets are configured. Edit config.php and add only IPs or networks you are authorized to test.';$('#setupNotice').classList.remove('hidden');$('#scan').disabled=true}
 let presets=$('#presets');Object.entries(policy.presets).forEach(([id,p])=>{let d=document.createElement('div');d.className='preset';d.innerHTML=`<input type="checkbox" id="pre-${esc(id)}"><label for="pre-${esc(id)}">${esc(p.label)}</label>`;d.querySelector('input').onchange=e=>{let current=new Set(selected());p.ports.forEach(v=>e.target.checked?current.add(v):current.delete(v));setPorts([...current])};presets.append(d)});
 let ports=$('#ports');Object.entries(policy.services).forEach(([port,name])=>{let d=document.createElement('div');d.className='port';d.innerHTML=`<input type="checkbox" name="port" id="p${port}" value="${port}"><label for="p${port}"><strong>${port}</strong> ${esc(name)}</label>`;ports.append(d)});
}
async function init(){try{let r=await fetch('scan.php',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Policy could not be loaded.');policy=j;renderPolicy()}catch(e){message(e.message);$('#scan').disabled=true}}$('#clear').onclick=()=>{setPorts([]);$$('.preset input').forEach(x=>x.checked=false)};$('#common').onclick=()=>setPorts([22,53,80,443,445,3389]);$('#scan').onclick=async()=>{message();let ip=$('#target').value,ports=selected();if(!ip)return message('Select an authorized target.');if(!ports.length)return message('Select at least one port.');if(ports.length>policy.maxPortsPerRequest)return message(`Select no more than ${policy.maxPortsPerRequest} ports.`);if(!$('#consent').checked)return message('Authorization confirmation is required.');let button=$('#scan');button.disabled=true;button.textContent='Checking...';try{let r=await fetch('scan.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip,ports,consent:true,csrfToken:policy.csrfToken})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'The check failed.');lastResult=j;renderResult(j)}catch(e){message(e.message)}finally{button.disabled=false;button.textContent='Check selected ports'}};
function renderResult(j){$('#tested').textContent=j.summary.tested;$('#open').textContent=j.summary.open;$('#noConnection').textContent=j.summary.noConnection;let list=$('#resultList');list.innerHTML='';j.results.forEach(r=>{let d=document.createElement('div');d.className='result '+r.status;d.innerHTML=`<div class="badge">${r.port}</div><div class="service"><strong>${esc(r.service)}</strong><span>${esc(r.summary)}</span></div><div class="latency">${r.connectionTimeMs} ms</div>`;list.append(d)});$('#resultMeta').textContent=`${j.target.label} (${j.target.ip}) • ${new Date(j.timestamp).toLocaleString()} • ${j.protocol}`;$('#resultsCard').classList.remove('hidden');$('#resultsCard').scrollIntoView({behavior:'smooth'})}
function resultText(){let j=lastResult,lines=['🔐 *AUTHORIZED PORT CHECK*','',`🎯 *Target:* ${j.target.label} (${j.target.ip})`,`🕒 *Time:* ${new Date(j.timestamp).toLocaleString()}`,'',`✅ Open: ${j.summary.open} | ⛔ No connection: ${j.summary.noConnection}`,''];j.results.forEach(r=>lines.push(`${r.status==='open'?'✅':'⛔'} *${r.port} — ${r.service}*\n${r.summary} (${r.connectionTimeMs} ms)`));lines.push('','ℹ️ No connection may mean closed, filtered, or timed out.');return lines.join('\n')}$('#copy').onclick=async function(){if(!lastResult)return;try{await navigator.clipboard.writeText(resultText())}catch{let a=document.createElement('textarea');a.value=resultText();document.body.append(a);a.select();document.execCommand('copy');a.remove()}this.textContent='✓ Copied';setTimeout(()=>this.textContent='Copy result',1800)};init();
</script></body></html>
